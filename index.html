<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视觉分拣数字孪生</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部：标题、步骤条、操作 -->
      <header class="topbar">
        <div class="brand">
          <!-- 简单的放射状标记 -->
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4" />
            </g>
          </svg>
          视觉分拣数字孪生
        </div>
        <ol id="stepper" class="stepper" aria-label="流程步骤"></ol>
        <div class="actions">
          <a class="btn btn-ghost" href="./board.html" target="_blank">标定板</a>
          <label class="btn btn-primary" for="file-input">上传照片</label>
          <input id="file-input" type="file" accept="image/*,.heic,.heif" hidden />
          <select id="sample-select" class="select" aria-label="加载示例">
            <option value="" selected>加载示例…</option>
          </select>
        </div>
      </header>

      <!-- 中间主区域：两个视图标签页 -->
      <main class="main">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" data-view="debug" aria-selected="true">调试视图</button>
          <button class="tab" role="tab" data-view="three" aria-selected="false">3D 视图</button>
        </div>
        <div class="views">
          <section id="view-debug" class="view active" role="tabpanel">
            <canvas id="debug-canvas"></canvas>
            <div class="view-tools">
              <label class="check" id="markers-toggle" hidden><input id="show-markers" type="checkbox" checked /> 识别结果</label>
              <label class="check" id="rect-toggle" hidden><input id="show-rect" type="checkbox" checked /> 正射图</label>
              <label class="check" id="pose-toggle" hidden><input id="show-pose" type="checkbox" checked /> 位姿叠加</label>
              <label class="check" id="truth-toggle" hidden><input id="show-truth" type="checkbox" checked /> 叠加真值</label>
              <label class="check" id="dets-toggle" hidden><input id="show-dets" type="checkbox" checked /> 检测框</label>
              <button type="button" class="icon-btn text" id="btn-boxedit" aria-pressed="false" disabled>框选</button>
              <span class="zoom-btns">
                <button type="button" class="icon-btn" id="zoom-out" aria-label="缩小">−</button>
                <button type="button" class="icon-btn" id="zoom-in" aria-label="放大">＋</button>
                <button type="button" class="icon-btn text" id="zoom-reset">复位</button>
              </span>
              <span class="hint hint-mouse">滚轮缩放 · 拖动平移 · 双击复位</span>
              <span class="hint hint-touch">双指缩放 · 单指拖动 · 双击复位</span>
            </div>
            <!-- 手动框选工具条 -->
            <div id="box-tools" class="box-tools" hidden>
              <select id="box-class" class="select" aria-label="类别"></select>
              <button type="button" class="icon-btn text" id="box-delete" disabled>删除</button>
              <button type="button" class="icon-btn text" id="box-clear">清空</button>
              <button type="button" class="icon-btn text" id="box-done">完成</button>
              <span class="hint hint-mouse">拖动画框 · 点框选中后可拖动 / 拉角 · Delete 删除 · 右键拖动平移</span>
              <span class="hint hint-touch">单指画框 · 点框选中后拖动 / 拉角 · 双指缩放</span>
            </div>
            <!-- 正射图小窗：点击放大 / 缩小 -->
            <figure id="rect-inset" class="inset" hidden>
              <canvas id="rect-canvas"></canvas>
              <figcaption>正射图 <span class="muted">· 虚线为设计的码位置 · 点击放大</span></figcaption>
            </figure>
          </section>
          <section id="view-three" class="view" role="tabpanel">
            <div id="three-container" class="three-container">
              <!-- 转场 / 对比时盖在画布上的照片 -->
              <canvas id="photo-overlay" class="photo-overlay" hidden></canvas>
            </div>
            <div class="view-tools">
              <label class="check"><input id="show-axes" type="checkbox" /> 坐标轴</label>
              <label class="check"><input id="show-part-labels" type="checkbox" checked /> 零件标签</label>
              <label class="check" title="纯色：干净的打印版面（没有照片里的阴影）；照片：照片的正射图，擦掉了零件；照片原图：不擦零件，能看到视差造成的重影">板面 <select class="select select-small" id="board-skin"><option value="plain" selected>纯色</option><option value="photo">照片</option><option value="raw">照片原图</option></select></label>
              <button type="button" class="icon-btn text" id="three-reset">默认视角</button>
              <button type="button" class="icon-btn text" id="btn-arm-debug" aria-pressed="false" title="点击底板或桌面，机械臂移动到该点正上方">机械臂调试</button>
              <button type="button" class="icon-btn text" id="btn-transition" disabled>转场</button>
              <button type="button" class="icon-btn text" id="btn-compare" aria-pressed="false" disabled>对比</button>
              <span class="hint hint-mouse">左键旋转 · 右键平移 · 滚轮缩放</span>
              <span class="hint hint-touch">单指旋转 · 双指缩放 / 平移</span>
            </div>
          </section>
        </div>
      </main>

      <!-- 右侧：信息面板 -->
      <aside id="info-panel" class="info-panel" aria-label="信息面板"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
